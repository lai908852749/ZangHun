syntax = "proto3";
package ET;

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_TestResponse
message C2M_TestRequest // ILocationRequest
{
	int32 RpcId = 1;
	string request = 2;
}

message M2C_TestResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}

// ResponseType G2C_EnterMap
message C2G_EnterMap // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_EnterMap // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	/// 自己的UnitId
	int64 MyId = 4;
}

message MoveInfo
{
	repeated Unity.Mathematics.float3 Points = 1;
	Unity.Mathematics.quaternion Rotation = 2;
	int32 TurnSpeed = 3;
}

message PetInfo
{
	int64 OwnerId = 1;
}

message UnitInfo
{
	int64 UnitId = 1;
	int32 ConfigId = 2;
	int32 Type = 3;
	Unity.Mathematics.float3 Position = 4;
	Unity.Mathematics.float3 Forward = 5;
	map<int32, int64> KV = 6;
	MoveInfo MoveInfo = 7;
	PetInfo PetInfo = 8;
}

message M2C_CreateUnits // IMessage
{
	repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit // IMessage
{
	UnitInfo Unit = 1;
}

message M2C_StartSceneChange // IMessage
{
	int64 SceneId = 1;
	string SceneName = 2;
}

message M2C_RemoveUnits // IMessage
{
	repeated int64 Units = 1;
}

message C2M_PathfindingResult // ILocationMessage
{
	int32 RpcId = 1;
	Unity.Mathematics.float3 Position = 2;
}

message C2M_Stop // ILocationMessage
{
	int32 RpcId = 1;
}

message M2C_PathfindingResult // IMessage
{
	int64 Id = 1;
	Unity.Mathematics.float3 Position = 2;
	repeated Unity.Mathematics.float3 Points = 3;
}

message M2C_Stop // IMessage
{
	int32 Error = 1;
	int64 Id = 2;
	Unity.Mathematics.float3 Position = 3;
	Unity.Mathematics.quaternion Rotation = 4;
}


message G2C_Test // ISessionMessage
{
}

// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}



message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}

// ResponseType M2C_TransferMap
message C2M_TransferMap // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_TransferMap // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


message M2C_Error // IMessage
{
	int32 Error = 1;
	repeated string Values = 2;
}

message M2C_NumericChange // IMessage
{
	int64 UnitId = 1;
	int32 NumericType = 2;
	int64 Value = 3;
}

message C2M_SelectTarget // ILocationMessage
{
	int32 RpcId = 1;
	int64 TargetUnitId = 2;
}

message M2C_Turn // IMessage
{
	int64 UnitId = 1;
	Unity.Mathematics.quaternion Rotation = 2;
	int32 TurnTime = 3;
}


// ResponseType G2C_Logout
message C2G_Logout // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Logout // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ============= 回合制战斗相关消息 =============

// ResponseType M2C_StartCombat
message C2M_StartCombat // ILocationRequest
{
	int32 RpcId = 1;
	repeated int64 MonsterIds = 2;  // 要战斗的怪物单位ID列表
}

message M2C_StartCombat // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated int64 TurnOrder = 4;   // 行动顺序（单位ID列表）
}

// 玩家战斗动作（单向消息，无需响应）
message C2M_CombatAction // IMessage
{
	int32 ActionType = 1;  // 1=攻击 2=跳过
	int64 TargetId = 2;    // 目标单位ID
}

// 战斗回合开始通知
message M2C_CombatTurnStart // IMessage
{
	int64 ActorId = 1;      // 当前行动者ID
	bool IsPlayerTurn = 2;  // 是否玩家回合
	repeated int64 ValidTargets = 3;  // 可攻击目标列表
}

// 战斗动作结果
message M2C_CombatActionResult // IMessage
{
	int64 AttackerId = 1;
	int64 TargetId = 2;
	int32 Damage = 3;
	int32 RemainHp = 4;
	bool IsDead = 5;
}

// 战斗结束
message M2C_CombatEnd // IMessage
{
	bool IsWin = 1;
	int32 TotalRounds = 2;
	int64 Duration = 3;     // 战斗持续时间(毫秒)
}

